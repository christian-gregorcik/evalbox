[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalbox"
version = "0.1.0"
description = "Run a suite of checks against a language model and fail the build when it regresses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Christian Gregorcik" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
evalbox = "evalbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
